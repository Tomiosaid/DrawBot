 [env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino

; Vitesse du moniteur série pour le debug
monitor_speed = 115200

; Installation automatique des bibliothèques pour tes capteurs
lib_deps =
    adafruit/Adafruit LSM6DS @ ^4.7.0
    adafruit/Adafruit LIS3MDL @ ^1.2.1
    adafruit/Adafruit Unified Sensor @ ^1.1.9
